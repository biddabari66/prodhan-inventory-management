[version]
schema = 2

# ─── Backend API ──────────────────────────────────────────────────────────────
[[services]]
name = "backend"
source.repo = "biddabari66/prodhan-inventory-management"
source.branch = "main"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
buildCommand = ""

[services.deploy]
startCommand = "npx prisma migrate deploy && node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[services.variables]
NODE_ENV = "production"
# The backend will automatically receive the environment variables from Railway if they are linked in the UI,
# but we can explicitly define standard references here (Railway will prompt to link them):
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
REDIS_URL = "${{Redis.REDIS_URL}}"
FRONTEND_URL = "https://${{frontend.RAILWAY_PUBLIC_DOMAIN}}"

# ─── Frontend ─────────────────────────────────────────────────────────────────
[[services]]
name = "frontend"
source.repo = "biddabari66/prodhan-inventory-management"
source.branch = "main"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[services.variables]
# The frontend needs to know where the backend API is located to make requests
VITE_API_URL = "https://${{backend.RAILWAY_PUBLIC_DOMAIN}}/api/v1"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 20
